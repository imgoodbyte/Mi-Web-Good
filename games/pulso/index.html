<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="Pulso — atrapa a la ratita fugitiva antes de que termine el tiempo.">
  <title>Pulso — Good Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>

  <main class="game-shell">
    <section class="game-window" aria-labelledby="gameTitle">
      <header class="game-window__bar">
        <div class="game-window__title"><i></i><span id="gameTitle">Pulso / Experimento 001</span></div>
        <a class="icon-button" href="../../games.html" aria-label="Volver a Good Games">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </a>
      </header>

      <div class="game-hud">
        <div><span>CAPTURAS</span><strong id="score">00</strong></div>
        <div class="game-hud__message" id="gameMessage">Encuentra a la fugitiva</div>
        <div class="game-hud__time"><span>TIEMPO</span><strong id="time">30</strong></div>
      </div>

      <div class="arena" id="arena">
        <div class="arena__grid" aria-hidden="true"></div>
        <div class="game-feedback" id="gameFeedback" role="status" aria-live="polite"></div>
        <button class="target" id="target" type="button" aria-label="Atrapar a la ratita">
          <img src="assets/pulse-rat.png" alt="" aria-hidden="true">
        </button>
        <div class="game-start" id="gameStart">
          <span class="game-start__index">GOOD GAMES / 001</span>
          <img class="game-start__rat" src="assets/pulse-rat.png" alt="Ratita fugitiva de laboratorio">
          <h1>Pulso</h1>
          <p>La ratita escapó del laboratorio. Encuéntrala tantas veces como puedas antes de que termine el tiempo.</p>
          <button type="button" id="startGame">Comenzar persecución <span>→</span></button>
          <small>También puedes usar Tab + Enter</small>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
